name: PocketLens build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag must match VERSION.' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests without camera registration
        run: python -m unittest discover -s tests -v
      - name: Build x64 and x86 cameras
        shell: powershell
        run: '& ".\Build PocketLens Native.ps1"'
      - name: Validate JavaScript syntax
        shell: powershell
        run: |
          Get-ChildItem web/*.js, scripts/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $_" }
          }
      - name: Phone recovery regression tests
        run: node --test tests/phone-retry.test.js
      - name: Chrome virtual webcam and WebRTC integration
        shell: powershell
        run: '& ".\Test PocketLens Browser.ps1"'
      - name: Package releases
        run: |
          python scripts/package_release.py --kind windows
          python scripts/package_release.py --kind source
      - uses: actions/upload-artifact@v4
        with:
          name: pocketlens-windows
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocketlens-windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "PocketLens $RELEASE_TAG" --notes-from-tag
