name: PocketLens build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests without camera registration
        run: python -m unittest discover -s tests -v
      - name: Build x64 and x86 cameras
        shell: powershell
        run: '& ".\Build PocketLens Native.ps1"'
      - name: Validate JavaScript syntax
        shell: powershell
        run: |
          Get-ChildItem web/*.js, scripts/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $_" }
          }
      - name: Phone recovery regression tests
        run: node --test tests/phone-retry.test.js
      - name: Chrome virtual webcam and WebRTC integration
        shell: powershell
        run: '& ".\Test PocketLens Browser.ps1"'
      - name: Package Windows release
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pocketlens-windows
          path: dist/*
